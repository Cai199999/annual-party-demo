<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#060812">
  <title>年会签到 · 星光墙</title>
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    body.register-page {
      display: flex;
      align-items: center;
      align-items: safe center;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .phone {
      position: relative;
      z-index: 1;
      width: min(100%, 440px);
    }

    /* ---------- 签到卡 ---------- */
    .signup {
      padding: clamp(24px, 7vw, 40px);
      animation: rise 0.5s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    .brand-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border: 1px solid rgba(246, 196, 83, 0.32);
      border-radius: 999px;
      background: rgba(246, 196, 83, 0.07);
      color: var(--gold-light);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    .signup h1 {
      margin: 20px 0 10px;
      font-size: clamp(2rem, 9vw, 2.55rem);
      line-height: 1.16;
      letter-spacing: -0.02em;
    }

    .signup h1 span {
      background: linear-gradient(120deg, #ffe9a6 0%, #f6c453 45%, #ff8f6b 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.65;
    }

    .avatar-picker {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 116px;
      height: 116px;
      margin: 0 auto 24px;
      border: 2px dashed rgba(246, 196, 83, 0.42);
      border-radius: 50%;
      background: rgba(246, 196, 83, 0.055);
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .avatar-picker:hover {
      border-color: rgba(246, 196, 83, 0.8);
      background: rgba(246, 196, 83, 0.1);
      transform: translateY(-2px);
    }

    .avatar-picker.has-image {
      border-style: solid;
      border-color: rgba(246, 196, 83, 0.75);
      box-shadow: 0 0 0 6px rgba(246, 196, 83, 0.08), 0 16px 34px rgba(0, 0, 0, 0.35);
    }

    .avatar-picker img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .picker-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 0 12px;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.4;
      text-align: center;
    }

    .picker-placeholder .camera {
      font-size: 1.55rem;
      filter: saturate(0.8);
    }

    .picker-badge {
      position: absolute;
      right: 2px;
      bottom: 2px;
      display: grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border: 2px solid #101627;
      border-radius: 50%;
      background: linear-gradient(135deg, #ffe9a6, #f6c453 55%, #e2a51c);
      color: #241a02;
      font-size: 1.05rem;
      font-weight: 800;
      line-height: 1;
    }

    .field {
      display: block;
      margin-bottom: 18px;
    }

    .field > span {
      display: block;
      margin: 0 0 8px 4px;
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
    }

    .field input {
      width: 100%;
      padding: 15px 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      outline: none;
      background: rgba(0, 0, 0, 0.26);
      color: var(--text);
      font-size: 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .field input:focus {
      border-color: rgba(246, 196, 83, 0.62);
      box-shadow: 0 0 0 4px rgba(246, 196, 83, 0.1);
    }

    .field input::placeholder {
      color: rgba(147, 160, 184, 0.55);
    }

    .avatar-picker.is-loading::after {
      content: "压缩中…";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(6, 8, 18, 0.72);
      color: var(--gold-light);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
    }

    .submit-btn {
      width: 100%;
      padding: 1em;
      font-size: 1rem;
      letter-spacing: 0.08em;
    }

    .form-error {
      min-height: 1.2em;
      margin: 12px 0 0;
      color: #ffb3bf;
      font-size: 0.82rem;
      text-align: center;
    }

    .privacy {
      margin: 12px 0 0;
      color: rgba(147, 160, 184, 0.72);
      font-size: 0.71rem;
      text-align: center;
    }

    /* ---------- 聊天室 ---------- */
    .chat {
      display: flex;
      flex-direction: column;
      height: min(820px, calc(100dvh - max(16px, env(safe-area-inset-top)) - max(16px, env(safe-area-inset-bottom)) - 2px));
      padding: 14px 14px 12px;
      overflow: hidden;
      animation: rise 0.4s cubic-bezier(0.2, 0.9, 0.3, 1) both;
    }

    .chat-head {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 4px 14px;
      border-bottom: 1px solid var(--line);
    }

    .avatar-me {
      width: 46px;
      height: 46px;
      flex: 0 0 auto;
      border: 2px solid rgba(246, 196, 83, 0.5);
      border-radius: 50%;
      object-fit: cover;
    }

    .me-meta {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }

    .me-meta strong {
      overflow: hidden;
      font-size: 1rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .conn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 0.71rem;
    }

    .online-pill {
      flex: 0 0 auto;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      font-size: 0.71rem;
      white-space: nowrap;
    }

    .online-pill b {
      margin-left: 2px;
      color: var(--gold-light);
      font-size: 0.85rem;
    }

    .chat-list {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 10px;
      min-height: 0;
      padding: 16px 4px 8px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .system-msg {
      align-self: center;
      max-width: 90%;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.045);
      color: var(--muted);
      font-size: 0.71rem;
      line-height: 1.5;
      text-align: center;
      animation: msgIn 0.25s ease both;
    }

    .msg {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      max-width: 88%;
      animation: msgIn 0.25s ease both;
    }

    .msg-name {
      margin-left: 12px;
      color: var(--muted);
      font-size: 0.67rem;
    }

    .bubble {
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 16px 16px 16px 4px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.9rem;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .msg.own {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg.own .msg-name {
      margin-right: 12px;
      margin-left: 0;
      color: rgba(246, 196, 83, 0.8);
    }

    .msg.own .bubble {
      border-color: rgba(246, 196, 83, 0.34);
      border-radius: 16px 16px 4px 16px;
      background: linear-gradient(135deg, rgba(246, 196, 83, 0.24), rgba(246, 196, 83, 0.1));
    }

    .quick-chips {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      padding: 12px 2px 2px;
      border-top: 1px solid var(--line);
    }

    .quick-chips button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 46px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.03));
      color: rgba(244, 246, 251, 0.88);
      font-size: 0.82rem;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      transition:
        color 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease,
        transform 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .quick-chips button:last-child:nth-child(odd) {
      grid-column: 1 / -1;
    }

    .quick-chips .chip-emoji {
      font-size: 1.2em;
      line-height: 1;
    }

    .quick-chips button:hover,
    .quick-chips button:active {
      border-color: rgba(246, 196, 83, 0.45);
      background: linear-gradient(160deg, rgba(246, 196, 83, 0.17), rgba(246, 196, 83, 0.06));
      color: var(--gold-light);
    }

    .quick-chips button:active {
      transform: scale(0.97);
    }

    .quick-chips button.is-sent {
      border-color: rgba(246, 196, 83, 0.7);
      background: rgba(246, 196, 83, 0.22);
      color: #ffe9a6;
    }

    @media (max-height: 760px) {
      .signup {
        padding: 20px;
      }

      .signup h1 {
        margin: 14px 0 8px;
        font-size: 1.75rem;
      }

      .sub {
        margin-bottom: 16px;
        font-size: 0.82rem;
      }

      .avatar-picker {
        width: 92px;
        height: 92px;
        margin-bottom: 16px;
      }

      .field {
        margin-bottom: 13px;
      }

      .field input {
        padding: 12px 15px;
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body class="register-page">
  <main class="phone">
    <!-- 签到表单 -->
    <section class="signup panel" id="signupView">
      <div class="brand-chip">✦ ANNUAL PARTY · 签到</div>
      <h1>点亮你的<br><span>星光头像</span></h1>
      <p class="sub">填写信息、上传头像，即可登上现场大屏，和所有同事一起嗨翻年会。</p>

      <form id="signupForm" novalidate>
        <label class="avatar-picker" for="avatarInput" id="avatarPicker" title="上传头像">
          <img id="avatarPreview" alt="头像预览" hidden>
          <span class="picker-placeholder" id="pickerPlaceholder">
            <span class="camera">📷</span>
            <span>点击上传头像</span>
          </span>
          <span class="picker-badge" aria-hidden="true">+</span>
        </label>
        <input id="avatarInput" type="file" accept="image/*" hidden>

        <label class="field">
          <span>昵称（大屏显示）</span>
          <input id="nameInput" type="text" maxlength="20" placeholder="例如：小星星"
                 autocomplete="nickname" enterkeyhint="next" required>
        </label>

        <label class="field">
          <span>真实姓名</span>
          <input id="realNameInput" type="text" maxlength="20" placeholder="用于抽奖揭晓"
                 autocomplete="name" enterkeyhint="next" required>
        </label>

        <label class="field">
          <span>部门</span>
          <input id="departmentInput" type="text" maxlength="30" placeholder="例如：技术部"
                 autocomplete="organization" enterkeyhint="done" required>
        </label>

        <button type="submit" class="btn btn-gold submit-btn" id="submitBtn">
          <span id="submitText">签到并进入会场</span>
        </button>
        <p class="form-error" id="formError" role="alert"></p>
        <p class="privacy" id="avatarHint">头像会自动压缩至 200×200 以内 · 支持 JPG / PNG / GIF / WebP · 原图最大 5MB</p>
      </form>
    </section>

    <!-- 签到成功后的聊天室 -->
    <section class="chat panel" id="chatView" hidden>
      <header class="chat-head">
        <img class="avatar-me" id="meAvatar" alt="我的头像">
        <div class="me-meta">
          <strong id="meName">—</strong>
          <span class="conn">
            <i class="dot" id="connDot"></i>
            <span id="connText">连接中…</span>
          </span>
        </div>
        <div class="online-pill">在线 <b id="onlineCount">1</b></div>
      </header>

      <div class="chat-list scrollable" id="chatList" aria-live="polite"></div>

      <div class="quick-chips" id="quickChips" aria-label="快捷弹幕">
        <button type="button" data-text="🎉 新年快乐">
          <span class="chip-emoji" aria-hidden="true">🎉</span>
          <span>新年快乐</span>
        </button>
        <button type="button" data-text="😎 全场最靓">
          <span class="chip-emoji" aria-hidden="true">😎</span>
          <span>全场最靓</span>
        </button>
        <button type="button" data-text="💰 大奖拿来">
          <span class="chip-emoji" aria-hidden="true">💰</span>
          <span>大奖拿来</span>
        </button>
        <button type="button" data-text="👏 老板大气">
          <span class="chip-emoji" aria-hidden="true">👏</span>
          <span>老板大气</span>
        </button>
        <button type="button" data-text="🚀 666">
          <span class="chip-emoji" aria-hidden="true">🚀</span>
          <span>666</span>
        </button>
      </div>
    </section>
  </main>

  <script src="/static/js/common.js"></script>
  <script>
    (function () {
      "use strict";

      const signupView = document.getElementById("signupView");
      const chatView = document.getElementById("chatView");
      const signupForm = document.getElementById("signupForm");
      const avatarInput = document.getElementById("avatarInput");
      const avatarPicker = document.getElementById("avatarPicker");
      const avatarPreview = document.getElementById("avatarPreview");
      const pickerPlaceholder = document.getElementById("pickerPlaceholder");
      const nameInput = document.getElementById("nameInput");
      const realNameInput = document.getElementById("realNameInput");
      const departmentInput = document.getElementById("departmentInput");
      const avatarHint = document.getElementById("avatarHint");
      const submitBtn = document.getElementById("submitBtn");
      const submitText = document.getElementById("submitText");
      const formError = document.getElementById("formError");

      const meAvatar = document.getElementById("meAvatar");
      const meName = document.getElementById("meName");
      const connDot = document.getElementById("connDot");
      const connText = document.getElementById("connText");
      const onlineCount = document.getElementById("onlineCount");
      const chatList = document.getElementById("chatList");
      const quickChips = document.getElementById("quickChips");

      const MAX_FILE_SIZE = 5 * 1024 * 1024;
      const AVATAR_MAX_EDGE = 200;
      const AVATAR_QUALITY = 0.86;
      const DEFAULT_AVATAR_HINT = "头像会自动压缩至 200×200 以内 · 支持 JPG / PNG / GIF / WebP · 原图最大 5MB";
      const MAX_MESSAGES = 200;

      let me = null;
      let ws = null;
      let enterSent = false;
      let compressedBlob = null;
      let previewUrl = null;
      let compressionToken = 0;
      let compressing = false;

      function showFormError(message) {
        formError.textContent = message || "";
      }

      function displayName(user) {
        return (user && (user.nickname || user.name)) || "神秘嘉宾";
      }

      function winnerDisplayName(user) {
        return (user && (user.real_name || user.nickname || user.name)) || "神秘嘉宾";
      }

      function resetAvatar() {
        compressionToken += 1;
        compressedBlob = null;
        compressing = false;
        if (previewUrl) {
          URL.revokeObjectURL(previewUrl);
          previewUrl = null;
        }
        avatarPreview.removeAttribute("src");
        avatarPreview.hidden = true;
        pickerPlaceholder.hidden = false;
        avatarPicker.classList.remove("has-image", "is-loading");
        submitBtn.disabled = false;
        avatarHint.textContent = DEFAULT_AVATAR_HINT;
      }

      /* ---------------- 头像压缩 ---------------- */
      function loadImageFromFile(file) {
        return new Promise(function (resolve, reject) {
          const url = URL.createObjectURL(file);
          const image = new Image();
          image.onload = function () {
            resolve({ image: image, url: url });
          };
          image.onerror = function () {
            URL.revokeObjectURL(url);
            reject(new Error("图片读取失败，请换一张试试"));
          };
          image.src = url;
        });
      }

      async function compressAvatar(file) {
        const loaded = await loadImageFromFile(file);
        try {
          const sourceWidth = loaded.image.naturalWidth || loaded.image.width;
          const sourceHeight = loaded.image.naturalHeight || loaded.image.height;
          if (!sourceWidth || !sourceHeight) {
            throw new Error("图片尺寸无效，请换一张试试");
          }

          // 等比缩放，保证最长边不超过 200px
          const scale = Math.min(1, AVATAR_MAX_EDGE / Math.max(sourceWidth, sourceHeight));
          const width = Math.max(1, Math.round(sourceWidth * scale));
          const height = Math.max(1, Math.round(sourceHeight * scale));

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const context = canvas.getContext("2d");
          if (!context) {
            throw new Error("当前浏览器不支持图片压缩");
          }

          // 透明 PNG 转 JPEG 时铺白底，避免出现黑底
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, width, height);
          context.drawImage(loaded.image, 0, 0, width, height);

          const blob = await new Promise(function (resolve) {
            canvas.toBlob(resolve, "image/jpeg", AVATAR_QUALITY);
          });
          if (!blob) {
            throw new Error("图片压缩失败，请换一张试试");
          }
          return { blob: blob, width: width, height: height };
        } finally {
          URL.revokeObjectURL(loaded.url);
        }
      }

      /* ---------------- 头像选择、压缩与预览 ---------------- */
      avatarInput.addEventListener("change", async function () {
        showFormError("");
        const file = avatarInput.files && avatarInput.files[0];
        if (!file) return;

        if (!file.type || !file.type.startsWith("image/")) {
          resetAvatar();
          avatarInput.value = "";
          showFormError("请选择图片格式的头像");
          return;
        }
        if (file.size > MAX_FILE_SIZE) {
          resetAvatar();
          avatarInput.value = "";
          showFormError("原图不能超过 5MB");
          return;
        }

        const token = ++compressionToken;
        compressing = true;
        compressedBlob = null;
        submitBtn.disabled = true;
        avatarPicker.classList.add("is-loading");
        avatarHint.textContent = "正在压缩头像…";

        try {
          const result = await compressAvatar(file);
          if (token !== compressionToken) return;

          compressedBlob = result.blob;
          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = URL.createObjectURL(result.blob);
          avatarPreview.src = previewUrl;
          avatarPreview.hidden = false;
          pickerPlaceholder.hidden = true;
          avatarPicker.classList.add("has-image");
          avatarHint.textContent =
            "已压缩至 " + Math.max(1, Math.round(result.blob.size / 1024)) + " KB · " +
            result.width + "×" + result.height + " · 上传时使用压缩后的图片";
        } catch (error) {
          if (token !== compressionToken) return;
          resetAvatar();
          avatarInput.value = "";
          showFormError(error.message || "图片处理失败，请换一张试试");
        } finally {
          if (token === compressionToken) {
            compressing = false;
            submitBtn.disabled = false;
            avatarPicker.classList.remove("is-loading");
          }
        }
      });

      /* ---------------- 提交签到 ---------------- */
      signupForm.addEventListener("submit", async function (event) {
        event.preventDefault();
        showFormError("");

        const nickname = nameInput.value.trim();
        const realName = realNameInput.value.trim();
        const department = departmentInput.value.trim();

        if (!nickname) {
          showFormError("请先填写昵称");
          nameInput.focus();
          return;
        }
        if (nickname.length > 20) {
          showFormError("昵称不能超过 20 个字符");
          return;
        }
        if (!realName) {
          showFormError("请填写真实姓名");
          realNameInput.focus();
          return;
        }
        if (realName.length > 20) {
          showFormError("真实姓名不能超过 20 个字符");
          return;
        }
        if (!department) {
          showFormError("请填写部门");
          departmentInput.focus();
          return;
        }
        if (department.length > 30) {
          showFormError("部门不能超过 30 个字符");
          return;
        }
        if (compressing) {
          showFormError("头像正在压缩，请稍候");
          return;
        }
        if (!compressedBlob) {
          showFormError("请选择一张头像");
          return;
        }

        const formData = new FormData();
        formData.append("name", nickname);
        formData.append("nickname", nickname);
        formData.append("real_name", realName);
        formData.append("department", department);
        // 上传的是 Canvas 压缩后的 JPEG（最长边 ≤ 200px）
        formData.append("file", compressedBlob, "avatar.jpg");

        submitBtn.disabled = true;
        avatarInput.disabled = true;
        submitText.textContent = "签到中…";

        try {
          // 同源相对路径，自动适配热点 / 内网 IP 变化
          const data = await App.api("/api/register", {
            method: "POST",
            body: formData,
          });
          me = data.user;
          enterChat(data.user);
        } catch (error) {
          showFormError(error.message);
          App.toast(error.message, "error");
        } finally {
          submitBtn.disabled = false;
          avatarInput.disabled = false;
          submitText.textContent = "签到并进入会场";
        }
      });

      /* ---------------- 进入聊天室 ---------------- */
      function enterChat(user) {
        meAvatar.src = user.avatar_url;
        meAvatar.alt = displayName(user) + " 的头像";
        meName.textContent = displayName(user);
        meName.title = [user.real_name, user.department].filter(Boolean).join(" · ");
        signupView.hidden = true;
        chatView.hidden = false;

        appendSystem("🎉 签到成功，欢迎来到年会现场！");
        appendSystem("发一条弹幕，让大屏上的所有人看到你～");

        connectChat();
        notifyPresence();
      }

      function connectChat() {
        if (ws) return;
        ws = App.connectWS({
          onStatus: function (status) {
            const open = status === "open";
            connDot.className = "dot " + (open ? "online" : "offline");
            connText.textContent = open ? "已进入会场" : "连接断开，正在重连…";
            if (open) notifyPresence();
          },
          onMessage: handleMessage,
        });
      }

      /** 绑定当前连接（断线重连后也重新绑定），并只发送一次进场弹幕。 */
      function notifyPresence() {
        if (!ws || !ws.isOpen || !me) return;
        ws.send({ type: "identify", user_id: me.id });
        if (enterSent) return;
        const sent = ws.send({
          type: "enter_danmaku",
          name: displayName(me),
          text: "闪亮登场！",
        });
        if (sent) enterSent = true;
      }

      function handleMessage(message) {
        switch (message.type) {
          case "danmaku":
            appendChat(message.name, message.text);
            break;
          case "online":
            updateOnline(message.count);
            break;
          case "register":
            if (me && message.user && message.user.id !== me.id) {
              appendSystem("👋 " + displayName(message.user) + " 加入了会场");
            }
            break;
          case "draw":
            if (Array.isArray(message.winners) && message.winners.length) {
              const names = message.winners.map(function (user) {
                const dept = user.department ? "（" + user.department + "）" : "";
                return winnerDisplayName(user) + dept;
              }).join("、");
              appendSystem("🎊 恭喜 " + names + " 成为幸运星！");
            }
            break;
          case "reset":
            appendSystem("🔄 抽奖记录已重置");
            break;
          default:
            break;
        }
      }

      function updateOnline(count) {
        onlineCount.textContent = String(count || 0);
      }

      /* ---------------- 聊天渲染 ---------------- */
      function appendChat(name, text) {
        const own = !!me && name === displayName(me);

        const row = document.createElement("div");
        row.className = "msg" + (own ? " own" : "");

        const nameEl = document.createElement("span");
        nameEl.className = "msg-name";
        nameEl.textContent = own ? "我" : name;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        row.appendChild(nameEl);
        row.appendChild(bubble);
        chatList.appendChild(row);
        trimMessages();
        scrollToBottom();
      }

      function appendSystem(text) {
        const item = document.createElement("div");
        item.className = "system-msg";
        item.textContent = text;
        chatList.appendChild(item);
        trimMessages();
        scrollToBottom();
      }

      function trimMessages() {
        while (chatList.childElementCount > MAX_MESSAGES) {
          chatList.removeChild(chatList.firstElementChild);
        }
      }

      function scrollToBottom() {
        chatList.scrollTop = chatList.scrollHeight;
      }

      /* ---------------- 表情 / 短语弹幕 ---------------- */
      quickChips.addEventListener("click", function (event) {
        const button = event.target.closest("button[data-text]");
        if (!button || !quickChips.contains(button)) return;

        const text = (button.dataset.text || "").trim();
        if (!text) return;

        if (!ws || !ws.isOpen) {
          App.toast("连接已断开，正在重连…", "warn");
          return;
        }

        const sent = ws.send({ name: displayName(me), text: text });
        if (!sent) {
          App.toast("发送失败，请稍后重试", "error");
          return;
        }

        button.classList.add("is-sent");
        window.setTimeout(function () {
          button.classList.remove("is-sent");
        }, 320);
      });
    })();
  </script>
</body>
</html>
